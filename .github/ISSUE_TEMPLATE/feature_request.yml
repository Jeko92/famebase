name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide detailed information.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature
      placeholder: What would you like to see added or improved?
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: Issue Details
      description: Describe the feature, enhancement, or task
      placeholder: |
        ## Issue #X: Title
        **Labels:** `label1`, `label2`
        **Priority:** High/Medium/Low

        ### Description
        Describe what needs to be done...

        ### Tasks
        - [ ] Task 1
        - [ ] Task 2

        ### Acceptance Criteria
        - Criteria 1
        - Criteria 2
    validations:
      required: true